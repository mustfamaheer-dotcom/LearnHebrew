services:
  - type: web
    name: engrew-backend-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: postgresql://postgres.wlkalsgkstlhmzczinex:Av%2Aq.Wp2G-V3sL%2B@aws-0-eu-west-1.pooler.supabase.com:5432/postgres
      - key: FRONTEND_URL
        value: https://engrew.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_ROUNDS
        value: 12
      - key: APP_NAME
        value: Engrew Academy
