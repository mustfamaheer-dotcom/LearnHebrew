version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: engrew_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-learnhebrew}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learnhebrew_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-learnhebrew}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learnhebrew}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Redis Cache Service
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: engrew_redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # Backend API Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      target: backend-prod
    container_name: engrew_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5001
      DATABASE_URL: postgresql://${POSTGRES_USER:-learnhebrew}:${POSTGRES_PASSWORD:-learnhebrew_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-learnhebrew}?schema=public
      REDIS_URL: redis://redis:6379
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    ports:
      - "5001:5001"

  # ----------------------------------------------------------------------------
  # Nginx Web Server & Reverse Proxy
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: engrew_nginx
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - backend_uploads:/usr/share/nginx/html/uploads:ro

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  backend_logs:
